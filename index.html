<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Indicadores APG Capital</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: 'Segoe UI', Arial, sans-serif;
    overflow: hidden;
  }
  .barra-apg {
    background: linear-gradient(90deg, #6E101A 0%, #8C1C24 100%);
    border-bottom: 3px solid #C6922A;
    padding: 0;
  }
  .titulo-apg {
    color: #EFC873;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 8px 16px 4px 16px;
    margin: 0;
  }
  .ticker-wpc {
    padding: 2px 12px 6px 12px;
    font-size: 13px;
  }
  #dolar_wpc_ticker a { color: #EFC873 !important; text-decoration: none !important; }
  .tv-zone {
    background: #6E101A;
  }
</style>
</head>
<body>
  <div class="barra-apg">
    <p class="titulo-apg">Indicadores del mercado</p>
    <div class="ticker-wpc">
      <div id="dolar_wpc_ticker">
        <a href="https://dolar.wilkinsonpc.com.co/" target="_new">Indicadores Colombia</a>
      </div>
      <script type="text/javascript" src="https://widgets.wilkinsonpc.com.co/misc/misc-tickers1.js"></script>
    </div>
  </div>

  <!-- TradingView Ticker Tape (animado) -->
  <div class="tv-zone">
    <div class="tradingview-widget-container">
      <div class="tradingview-widget-container__widget"></div>
      <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
      {
        "symbols": [
          { "description": "Dólar", "proName": "FX_IDC:USDCOP" },
          { "description": "Brent", "proName": "TVC:UKOIL" },
          { "description": "WTI", "proName": "TVC:USOIL" },
          { "description": "Oro", "proName": "TVC:GOLD" },
          { "description": "Café", "proName": "ICEUS:KC1!" },
          { "description": "Aceite de Palma", "proName": "MYX:FUPO1!" },
          { "description": "Euro", "proName": "FX_IDC:EURCOP" },
          { "description": "S&P 500", "proName": "SP:SPX" }
        ],
        "showSymbolLogo": true,
        "isTransparent": true,
        "displayMode": "adaptive",
        "colorTheme": "dark",
        "locale": "es"
      }
      </script>
    </div>
  </div>
</body>
</html>
